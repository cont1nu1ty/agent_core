[project]
name = "stategrid-agent-core"
version = "0.2.0"
description = "Host-independent Agent runtime, tools, memory and planning contracts"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "deepagents==0.7.13",
    "httpx[socks]>=0.28,<1",
    "langchain==1.4.0",
    "langchain-core==1.6.3",
    "langchain-openai==1.6.2",
    "langgraph==1.2.11",
    "langgraph-checkpoint==4.2.0",
    "pydantic>=2.11,<3",
    "typing-extensions>=4.12,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_core"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.23,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
